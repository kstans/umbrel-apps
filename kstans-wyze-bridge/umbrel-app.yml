manifestVersion: 1
id: kstans-wyze-bridge
category: automation
name: Wyze Bridge
version: "4.6.1-beta.1"
tagline: Local RTSP/WebRTC/HLS streams for Wyze cameras
icon: https://cdn.jsdelivr.net/gh/kstans/umbrel-apps@main/kstans-wyze-bridge/icon.svg
description: >
  docker-wyze-bridge (IDisposable fork), packaged with the
  idisposablegithub365/wyze-bridge image. Exposes each Wyze camera at
  rtsp://<umbrel-ip>:8554/<camera_name> for Home Assistant and other players.


  Setup: before starting it, add these custom environment variables on the
  "server" service in the app's settings: WYZE_EMAIL, WYZE_PASSWORD,
  WYZE_API_ID and WYZE_API_KEY (API ID and key come from
  https://developer-api-console.wyze.com/#/apikey/view). Add WYZE_TOTP_KEY if
  the Wyze account uses 2FA.
developer: IDisposable
website: https://github.com/IDisposable/docker-wyze-bridge
dependencies: []
repo: https://github.com/IDisposable/docker-wyze-bridge
support: https://github.com/IDisposable/docker-wyze-bridge/issues
port: 5080
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >
  Bridge 4.6.1-beta.1: fixes WebRTC ICE servers and re-logs in when the Wyze
  token expires. Outdoor V2 (HL_WCO2) cameras are routed over WebRTC.
submitter: kstans
submission: https://github.com/kstans/umbrel-apps
