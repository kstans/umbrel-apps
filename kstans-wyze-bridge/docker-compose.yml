version: "3.7"

services:
  server:
    image: idisposablegithub365/wyze-bridge:4.6.1-beta.1@sha256:a03a9651d398f3ea93717718d32c8587310548ed24502ebe6173b6789cbd6e1b
    restart: unless-stopped
    # Host networking: Wyze TUTK cameras dial back over UDP, which Docker's bridge NAT
    # drops. Also keeps WebUI :5080, RTSP :8554, HLS :8888, WebRTC :8889/:8189 at the
    # Umbrel's own address for Home Assistant.
    network_mode: host
    environment:
      # LAN address browsers use for WebRTC playback.
      BRIDGE_IP: 192.168.7.40
      TZ: America/New_York
    # Wyze credentials are deliberately not here: set WYZE_EMAIL, WYZE_PASSWORD,
    # WYZE_API_ID and WYZE_API_KEY as custom environment variables on the "server"
    # service in the app's umbrelOS settings.
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/media:/media
