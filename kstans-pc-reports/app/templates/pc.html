<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Report</title>
<link rel="stylesheet" href="../report.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script id="data" type="application/json">__DATA__</script>
<script src="../report.js"></script>
<script>
const d = JSON.parse(document.getElementById('data').textContent);
const TITLE = '__TITLE__', BACK = '__BACK__', MID = '__ID__';
// OK marks for this PC (data\acks.json), embedded by the server.
const ACKS = __ACKS__;
const { html, software, shown } = pcReport(d, { title: TITLE, back: BACK, id: MID, acks: ACKS });
document.title = `${shown} - PC Report`;
document.getElementById('app').innerHTML = html;

const draw = () => {
  const q = document.getElementById('q').value.toLowerCase();
  const hit = software.filter(s => !q || `${s.Name} ${s.Publisher}`.toLowerCase().includes(q));
  document.getElementById('sw').innerHTML = hit.map(pcReport.swRow).join('');
  document.getElementById('n').textContent = `${hit.length} of ${software.length}`;
};
document.getElementById('q').addEventListener('input', draw);
draw();
// A PDF gets every program and service, whatever the filter box and the services fold say.
const svcFold = document.querySelector('section details');
addEventListener('beforeprint', () => { document.getElementById('q').value = ''; draw(); if (svcFold) svcFold.open = true; });

// Rescan (only when served by the PC Reports server): runs pc-report on this PC, then reloads.
if (MID && location.protocol.startsWith('http')) {
  const box = document.getElementById('job'), btn = document.getElementById('rs');
  const api = async (path, body) => {
    const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  };
  let mine = null;
  const show = j => {
    if (!j || j.state === 'idle') { box.hidden = true; return; }
    box.hidden = false; box.className = 'job ' + j.state;
    const r = (j.results || []).find(x => x.id === MID);
    box.textContent = j.state === 'running' ? `Rescanning ${j.label}: ${j.step}…` :
      j.state === 'done' ? `Rescan of ${j.label} finished: ${r ? r.status : j.step}.` : `Rescan failed: ${j.step}`;
    btn.disabled = j.state === 'running';
  };
  const poll = async () => {
    let j; try { j = await api('/api/job'); } catch { return; }
    show(j);
    if (j.state === 'running') return setTimeout(poll, 3000);
    if (mine && j.id === mine && (j.results || []).some(x => x.id === MID && x.status === 'updated')) setTimeout(() => location.reload(), 1500);
  };
  // Mark OK / Undo: the server saves it in data\acks.json; the page reloads to show it.
  document.addEventListener('click', async e => {
    const b = e.target.closest('.ack');
    if (!b) return;
    b.disabled = true; b.textContent = 'Saving…';
    try { await api('/api/ack', { id: MID, key: b.dataset.key, ok: b.dataset.ok === '1' }); location.reload(); }
    catch (err) { b.disabled = false; b.textContent = 'Failed'; b.title = err.message; }
  });
  btn.addEventListener('click', async () => {
    try { mine = (await api('/api/rescan', { ids: [MID], label: shown })).id; poll(); }
    catch (e) { show({ state: 'failed', step: e.message }); }
  });
  api('/api/ping').then(() => { document.body.classList.add('live'); poll(); }).catch(() => {});
}
</script>
</body>
</html>
