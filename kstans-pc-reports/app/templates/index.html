<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Report</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #1d2330; --muted: #6a7282; --line: #e3e6eb; --accent: #2563eb;
  --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --ok-bg: #e8f5ec; --warn-bg: #fdf3e2; --bad-bg: #fbe9e9; --chip: #eef0f3;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12151b; --card: #1a1f27; --ink: #e6e9ef; --muted: #98a1b2; --line: #2a313c; --accent: #6ea0ff;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --ok-bg: #16281d; --warn-bg: #2c2414; --bad-bg: #2e1819; --chip: #252b35; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
h1 .ver { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; vertical-align: 4px; }
.sub, .small { color: var(--muted); }
.small { font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  font: inherit; color: inherit; text-align: left; cursor: pointer; }
.stat:hover { border-color: var(--accent); }
.stat.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stat .v { font-size: 22px; font-weight: 600; }
.stat .split { font-size: 14px; font-weight: 600; color: var(--muted); }
.stat .split span { padding: 0 3px; border-radius: 4px; }
.stat .split span:hover { text-decoration: underline; }
.stat .split .up { color: var(--ok); }
.stat .split .down { color: var(--bad); }
.stat .split .sel { box-shadow: inset 0 0 0 1px currentColor; }
.tools { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type=search] { flex: 1; min-width: 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font: inherit; }
label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
nav a { padding: 3px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 13px; }
nav a:hover { border-color: var(--accent); }
nav a.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
nav a .n { font-size: 12px; color: var(--muted); margin-left: 4px; }
nav a .up { color: var(--ok); }
details.group { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
details.group > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary h2 { margin: 0; font-size: 19px; }
details.group > summary::before { content: '\25B8'; color: var(--muted); }
details.group[open] > summary::before { content: '\25BE'; }
.sg { padding: 0 16px 14px; }
.sg h3 { margin: 10px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
td.f { white-space: normal; min-width: 220px; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr.off td { color: var(--muted); }
a.pc { color: var(--accent); font-weight: 600; text-decoration: none; }
a.pc:hover { text-decoration: underline; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.dot.on { background: var(--ok); }
.use.in { color: var(--ok); font-weight: 600; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 12px; margin: 1px 4px 1px 0; background: var(--chip); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.acked { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
/* Mark OK / Undo inside a chip; only when the page comes from the report server. */
.chip .ack { display: none; margin-left: 5px; padding: 0 5px; border: 0; border-radius: 999px; font: inherit; font-size: 11px;
  background: rgba(127,127,127,0.18); color: inherit; cursor: pointer; }
body.live .chip .ack { display: inline-block; }
.chip .ack:hover { background: rgba(127,127,127,0.35); }
.count { font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); padding: 6px 0 4px; }
/* Rescan buttons only show when the page comes from the report server (scripts\pc-reports-server.mjs). */
.rs { display: none; font: inherit; font-size: 12px; padding: 1px 8px; margin-left: 8px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--card); color: var(--accent); cursor: pointer; vertical-align: 1px; }
body.live .rs { display: inline-block; }
a.rs { text-decoration: none; }
.rs:hover { border-color: var(--accent); }
/* Remote control: opens a session in the SimpleHelp Technician Console (simplehelp://?JW_machine=<ID>).
   Works on any computer with the Technician Console installed, signed in or not to this page. */
.rc { display: inline-block; font-size: 12px; padding: 1px 8px; margin-left: 8px; border: 1px solid var(--ok); border-radius: 6px;
  color: var(--ok); text-decoration: none; vertical-align: 1px; white-space: nowrap; }
.rc:hover { background: var(--ok-bg); }
@media print { .rc { display: none; } }
/* PDF of a group or subgroup: opens one printable page with every scanned PC in it. */
a.pdf { display: none; font-size: 12px; padding: 1px 8px; margin-left: 8px; border: 1px solid var(--line); border-radius: 6px;
  color: var(--accent); background: var(--card); text-decoration: none; vertical-align: 1px; white-space: nowrap; }
body.live a.pdf { display: inline-block; }
a.pdf:hover { border-color: var(--accent); }
.rs.armed { background: var(--accent); color: #fff; border-color: var(--accent); }
.rs:disabled { opacity: 0.5; cursor: default; }
.job { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); }
.job.failed { border-left-color: var(--bad); }
.job.done { border-left-color: var(--ok); }
.job ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
@media print { .tools, nav, .rs, .job { display: none; } details.group { break-inside: avoid; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>PC Report <span class="ver">v__VERSION__</span></h1>
  <div class="sub">Every machine in SimpleHelp by group. Built __BUILT__. Click a name for its PC report.</div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Find a computer, user or model">
    <label><input type="checkbox" id="onl" checked> Online only</label>
    <label><input type="checkbox" id="att"> Needs attention</label>
    <span class="small" id="n"></span>
    <button class="rs" id="refresh" type="button" title="Re-read groups, names and online status from SimpleHelp. Runs nothing on any PC.">Refresh list</button>
    <a class="rs" href="/fixav" title="What auto fix AV has removed and turned on">Fix AV log</a>
    <a class="rs" href="/logout" title="Sign out of PC Reports">Sign out</a>
  </div>
  <div id="job" class="job" hidden></div>
  <nav id="nav"></nav>
  <div id="groups"></div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const all = JSON.parse(document.getElementById('data').textContent);
const esc = v => v == null ? '' : String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const order = ['C4', 'Town of Clyde', 'MPI', 'Customer', 'GahaganCPA', 'Grace Church', 'Ungrouped'];
// Not "top": that is window.top, and redeclaring it stops the whole script.
const topGroup = g => g.split('/')[0];
const tops = [...new Set(all.map(m => topGroup(m.group)))].sort((a, b) => ((order.indexOf(a) + 99) % 99) - ((order.indexOf(b) + 99) % 99) || a.localeCompare(b));
// Flags marked OK (f.ok) still show, greyed, but don't count toward a PC's status.
const live = m => m.flags.filter(f => !f.ok);
const worst = m => live(m).some(f => f.s === 'bad') ? 2 : live(m).length ? 1 : 0;

// The cards are filters: click one to list only those machines, click it again (or "Machines in
// SimpleHelp") to show everything. Each card's test is the same one its count uses.
const cards = {
  all:    { k: 'Machines in SimpleHelp', test: m => true },
  online: { k: 'Online now', test: m => m.online },
  report: { k: 'PC reports', x: 'scanned at least once', test: m => m.report },
  bad:    { k: 'Serious issues', x: 'red flags, e.g. no updates', test: m => m.report && worst(m) === 2 },
  warn:   { k: 'Worth a look', x: 'amber flags only', test: m => m.report && worst(m) === 1 },
  ok:     { k: 'Look healthy', test: m => m.report && worst(m) === 0 },
};
let card = 'all', grp = '';   // grp: the top-level group a group chip is filtering on ('' = every group)
let offOnly = false;          // set by a card's red offline number: list only the offline ones
function drawStats() {
  const onl = document.getElementById('onl').checked;
  document.getElementById('stats').innerHTML = Object.entries(cards).map(([id, c]) => {
    const ms = all.filter(c.test), on = ms.filter(m => m.online).length, sel = card === id && (id !== 'all' || offOnly || onl);
    // Green = online, red = offline; each number lists just those, the rest of the card lists both.
    const split = id === 'online' ? '' : `<div class="split"><span class="up${sel && onl ? ' sel' : ''}" data-show="on" title="List the ${on} online">${on}</span> /
      <span class="down${sel && offOnly ? ' sel' : ''}" data-show="off" title="List the ${ms.length - on} offline">${ms.length - on}</span></div>`;
    return `<button class="stat${card === id && id !== 'all' ? ' on' : ''}" type="button" data-card="${id}" title="${id === 'all' ? 'Show every machine' : 'Show only these, online and offline; click again to show all'}">
      <div class="small">${c.k}</div><div class="v">${ms.length}</div>${split}<div class="small">${c.x || ''}</div></button>`;
  }).join('');
}
document.getElementById('stats').addEventListener('click', e => {
  const b = e.target.closest('.stat');
  if (!b) return;
  const show = e.target.closest('[data-show]')?.dataset.show || '';
  const wasOnl = document.getElementById('onl').checked;
  // Clicking what is already showing turns it off again.
  const same = b.dataset.card === card && (show === 'on' ? wasOnl : show === 'off' ? offOnly : !wasOnl && !offOnly);
  card = same ? 'all' : b.dataset.card;
  offOnly = !same && show === 'off';
  // The big number counts offline machines too (except "Online now"), so the list should too.
  document.getElementById('onl').checked = !same && (show === 'on' || card === 'online');
  drawStats(); draw();
});
drawStats();

// In use / not in use under the user, from the server's 5-minute poll of SimpleHelp. Online PCs only;
// an offline PC's last SimpleHelp state is stale.
const ago = ms => { const n = Math.max(0, Math.round((Date.now() - ms) / 60000));
  return n < 60 ? `${n} min ago` : n < 2880 ? `${Math.round(n / 60)} h ago` : `${Math.round(n / 1440)} d ago`; };
const useLine = m => !m.online || !m.use ? '' : m.use.inUse
  ? `<div class="small use in" title="SimpleHelp shows it in use (since about ${esc(new Date(m.use.since).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }))})">In use</div>`
  : `<div class="small use">Not in use${m.use.lastInUse ? `, in use ${ago(m.use.lastInUse)}` : ''}</div>`;
const row = m => `<tr class="${m.online ? '' : 'off'}">
  <td><span class="dot ${m.online ? 'on' : ''}" title="${m.online ? 'online' : 'offline'}"></span>${m.report ? `<a class="pc" href="pc/${esc(m.id)}.html">${esc(m.name)}</a>` : esc(m.name)}${rsBtn([m], m.name, 'Rescan')}${m.online ? `<a class="rc" href="simplehelp://?JW_machine=${encodeURIComponent(m.id)}" title="Open a remote control session in the SimpleHelp Technician Console">Remote</a>` : ''}
    ${m.host && m.host.toLowerCase() !== String(m.name).toLowerCase() ? `<div class="small">${esc(m.host)}</div>` : ''}</td>
  <td>${esc(m.user)}${useLine(m)}</td>
  <td>${esc(m.os)}${m.model ? `<div class="small">${esc(m.model)}</div>` : ''}</td>
  <td>${m.report ? esc(m.lastUpdate || '-') : ''}</td>
  <td>${m.uptime != null ? m.uptime + ' d' : ''}</td>
  <td>${m.cFree != null ? m.cFree + '%' : ''}</td>
  <td class="f">${m.report ? (m.flags.length ? (live(m).length ? '' : '<span class="chip ok">OK</span>') + m.flags.map(f => f.ok
       ? `<span class="chip acked" title="Marked OK">&#10003; ${esc(f.t)}<button class="ack" type="button" data-id="${esc(m.id)}" data-key="${esc(f.k)}" data-ok="0" title="Undo: show this warning again">&times;</button></span>`
       : `<span class="chip ${f.s}">${esc(f.t)}<button class="ack" type="button" data-id="${esc(m.id)}" data-key="${esc(f.k)}" data-ok="1" title="Mark OK: I know about this">OK</button></span>`).join('') : '<span class="chip ok">OK</span>')
     : `<span class="small">${m.online ? 'no report yet' : 'offline, last seen ' + esc(m.lastSeen)}</span>`}</td></tr>`;
const head = '<tr><th>Computer</th><th>User</th><th>Windows</th><th>Last update</th><th>Uptime</th><th>C: free</th><th>Flags</th></tr>';

function draw() {
  const q = document.getElementById('q').value.toLowerCase(), onl = document.getElementById('onl').checked, att = document.getElementById('att').checked;
  const narrow = q || att || card !== 'all';   // filtering, so hide groups and subgroups with no match
  const keep = m => (!onl || m.online) && (!offOnly || !m.online) &&(!att || worst(m) > 0) && cards[card].test(m) &&
    (!q || `${m.name} ${m.host} ${m.user} ${m.model} ${m.os} ${m.group}`.toLowerCase().includes(q));
  let shown = 0;
  document.getElementById('groups').innerHTML = tops.filter(t => !grp || t === grp).map(t => {
    const inTop = all.filter(m => topGroup(m.group) === t), vis = inTop.filter(keep);
    shown += vis.length;
    if (!vis.length && narrow) return '';
    const subs = [...new Set(inTop.map(m => m.group))].sort((a, b) => (a === t ? -1 : b === t ? 1 : a.localeCompare(b)));
    const body = subs.map(s => {
      const ms = vis.filter(m => m.group === s).sort((a, b) => b.online - a.online || worst(b) - worst(a) || a.name.localeCompare(b.name));
      const tot = inTop.filter(m => m.group === s);
      if (!ms.length && (narrow || onl)) return subs.length > 1 && !narrow ? `<h3>${esc(s === t ? t : s.slice(t.length + 1))} <span class="count">${tot.filter(m=>m.online).length} of ${tot.length} online</span></h3><div class="empty">Nothing online.</div>` : '';
      return `${subs.length > 1 ? `<h3>${esc(s === t ? t + ' (no subgroup)' : s.slice(t.length + 1))} <span class="count">${tot.filter(m=>m.online).length} of ${tot.length} online</span>${rsBtn(tot, s, 'Rescan subgroup')}${pdfLink(tot, s, true)}</h3>` : ''}
        <div class="tw"><table><thead>${head}</thead><tbody>${ms.map(row).join('')}</tbody></table></div>`;
    }).join('');
    const on = inTop.filter(m => m.online).length, red = inTop.filter(m => m.report && worst(m) === 2).length;
    return `<details class="group" id="g-${esc(t.replace(/\W+/g, '-'))}" open><summary><h2>${esc(t)}</h2>
      <span class="count">${on} online of ${inTop.length}${red ? ` &middot; <span style="color:var(--bad)">${red} with serious issues</span>` : ''}</span>${rsBtn(inTop, t, 'Rescan group')}${pdfLink(inTop, t, false)}</summary><div class="sg">${body}</div></details>`;
  }).join('');
  document.getElementById('n').textContent = `${shown} shown${offOnly ? ' (offline only)' : ''}`;
}
// ---- Rescan (only when served by scripts\pc-reports-server.mjs) ----
// A button carries the online machine IDs it covers. Group buttons need a second click to confirm.
function rsBtn(ms, label, text) {
  const ids = ms.filter(m => m.online).map(m => m.id);
  if (!ids.length) return '';
  return `<button class="rs" type="button" data-ids="${esc(ids.join(','))}" data-label="${esc(label)}" data-text="${esc(text)}">${esc(text)}</button>`;
}
// exact: just this subgroup; otherwise the group and everything under it. Offline PCs are included
// when they have a report.
function pdfLink(ms, group, exact) {
  const n = ms.filter(m => m.report).length;
  if (!n) return '';
  return `<a class="pdf" href="print?group=${encodeURIComponent(group)}${exact ? '&exact=1' : ''}" target="_blank" rel="noopener"
    title="Open the ${n} scanned PC report${n === 1 ? '' : 's'} as one document to save as PDF">PDF (${n})</a>`;
}
const jobBox = document.getElementById('job');
let myJob = null;
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function showJob(j) {
  if (!j || j.state === 'idle') { jobBox.hidden = true; return; }
  jobBox.hidden = false;
  jobBox.className = 'job ' + j.state;
  const what = j.label === 'the machine list' ? 'Refresh of the machine list' : `Rescan of ${esc(j.label)}`;
  const head = j.state === 'running' ? `${j.label === 'the machine list' ? 'Refreshing the machine list' : `Rescanning ${esc(j.label)}`}: ${esc(j.step)}\u2026` :
    j.state === 'done' ? `${what} finished: ${esc(j.step)}.` : `${what} failed: ${esc(j.step)}`;
  const odd = (j.results || []).filter(r => r.status !== 'updated');
  jobBox.innerHTML = head + (odd.length ? `<ul>${odd.map(r => `<li>${esc(r.name)}: ${esc(r.status)}</li>`).join('')}</ul>` : '');
  document.querySelectorAll('.rs').forEach(b => b.disabled = j.state === 'running');
}
async function poll() {
  let j; try { j = await api('/api/job'); } catch { return; }
  showJob(j);
  if (j.state === 'running') return setTimeout(poll, 3000);
  // Our own rescan just finished: reload to show the new data.
  if (myJob && j.id === myJob && j.state === 'done') setTimeout(() => location.reload(), 1500);
}
document.addEventListener('click', async e => {
  // Mark OK / Undo on a flag chip: the server saves it and rebuilds the pages, then this page reloads.
  const a = e.target.closest('.ack');
  if (a) {
    e.preventDefault();
    a.disabled = true; a.textContent = '\u2026';
    try { await api('/api/ack', { id: a.dataset.id, key: a.dataset.key, ok: a.dataset.ok === '1' }); location.reload(); }
    catch (err) { a.disabled = false; a.textContent = '!'; a.title = err.message; }
    return;
  }
  const b = e.target.closest('button.rs');   // links like Sign out keep their normal behavior
  if (!b) return;
  e.preventDefault(); e.stopPropagation();   // a button inside <summary> must not fold the group
  if (b.id === 'refresh') {
    try { myJob = (await api('/api/refresh', {})).id; poll(); }
    catch (err) { showJob({ state: 'failed', label: 'the machine list', step: err.message }); }
    return;
  }
  const ids = b.dataset.ids.split(',');
  if (ids.length > 1 && !b.classList.contains('armed')) {
    b.classList.add('armed');
    b.textContent = `Run pc-report on ${ids.length} PCs?`;
    setTimeout(() => { b.classList.remove('armed'); b.textContent = b.dataset.text; }, 5000);
    return;
  }
  b.classList.remove('armed'); b.textContent = b.dataset.text;
  try { myJob = (await api('/api/rescan', { ids, label: b.dataset.label })).id; poll(); }
  catch (err) { showJob({ state: 'failed', label: b.dataset.label, step: err.message }); }
});
if (location.protocol.startsWith('http')) {
  api('/api/ping').then(() => { document.body.classList.add('live'); poll(); }).catch(() => {});
}

// Rescan every online PC at once (needs a second click to confirm, like the group buttons).
document.getElementById('refresh').insertAdjacentHTML('beforebegin', rsBtn(all, 'all online PCs', 'Rescan all'));
// Group chips are filters too: click one to list only that group, click it again to show every group.
function drawNav() {
  document.getElementById('nav').innerHTML = tops.map(t => {
    const ms = all.filter(m => topGroup(m.group) === t), on = ms.filter(m => m.online).length;
    return `<a href="#g-${esc(t.replace(/\W+/g, '-'))}" class="${grp === t ? 'on' : ''}" data-grp="${esc(t)}" title="${grp === t ? 'Click again to show every group' : `Show only ${esc(t)}`}">${esc(t)}
      <span class="n"><span class="up">${on} online</span> &middot; ${ms.length - on} offline</span></a>`;
  }).join('');
}
document.getElementById('nav').addEventListener('click', e => {
  const a = e.target.closest('a[data-grp]');
  if (!a) return;
  e.preventDefault();
  grp = a.dataset.grp === grp ? '' : a.dataset.grp;
  drawNav(); draw();
});
drawNav();
['q', 'att'].forEach(id => document.getElementById(id).addEventListener('input', draw));
// Ticking "Online only" ends an offline-only view; either way the card highlights follow it.
document.getElementById('onl').addEventListener('input', () => { if (document.getElementById('onl').checked) offOnly = false; drawStats(); draw(); });

// Reload every hour to show what the server picked up (it re-reads SimpleHelp every 15 minutes and
// scans new PCs), keeping the search, checkboxes and card filter. Waits while a job is running.
const KEEP = 'pcr-view';
try {
  const v = JSON.parse(sessionStorage.getItem(KEEP) || 'null');
  if (v) { document.getElementById('q').value = v.q; document.getElementById('onl').checked = v.onl; document.getElementById('att').checked = v.att;
    if (cards[v.card]) card = v.card; if (tops.includes(v.grp)) grp = v.grp; offOnly = !!v.offOnly; drawStats(); drawNav(); }
} catch { /* storage blocked: start fresh */ }
function hourly() {
  if (!jobBox.hidden && jobBox.classList.contains('running')) return setTimeout(hourly, 60000);
  try { sessionStorage.setItem(KEEP, JSON.stringify({ q: document.getElementById('q').value, onl: document.getElementById('onl').checked,
    att: document.getElementById('att').checked, card, grp, offOnly, y: scrollY })); } catch { /* storage blocked */ }
  location.reload();
}
if (location.protocol.startsWith('http')) setTimeout(hourly, 60 * 60 * 1000);
draw();
try { const y = JSON.parse(sessionStorage.getItem(KEEP) || 'null')?.y; if (y) scrollTo(0, y); sessionStorage.removeItem(KEEP); } catch { /* storage blocked */ }
</script>
