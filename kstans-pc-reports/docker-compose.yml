version: "3.7"

services:
  server:
    # Built from app/ by .github/workflows/pc-reports-image.yml. The code lives in the image because
    # umbrelOS does not replace files inside an installed app's folder on update.
    image: ghcr.io/kstans/pc-reports:1.2.0@sha256:003d9fd4b684c0871c2aa8ca1953dece4c7fba318ad3e776c5b5229b26d8a206
    restart: unless-stopped
    # Host networking: SimpleHelp's Web API only accepts Tailscale addresses, and the Umbrel's
    # Tailscale app also runs on the host network, so Tailscale Serve (:8444 -> 8765) and the
    # SimpleHelp API calls both work at the Umbrel's own addresses.
    network_mode: host
    user: "1000:1000"
    environment:
      PORT: "8765"
      DATA_DIR: /data
      TZ: America/New_York
    # The password and SimpleHelp settings are deliberately not here: set PC_REPORTS_PASSWORD,
    # SIMPLEHELP_URL, SIMPLEHELP_TOKEN, SIMPLEHELP_TECHNICIAN and SIMPLEHELP_CONNECT_ADDRESS as
    # custom environment variables on the "server" service in the app's umbrelOS settings.
    volumes:
      - ${APP_DATA_DIR}/data:/data
