releaseNotes: "Shows the version next to the PC Report heading. Includes 1.2.0: legacy reports for Windows 7 / Server 2008 R2 (needs the pc-report and pc-report-legacy tools from pc-reports-tools.tbx), and the update check reads Windows Update history."
