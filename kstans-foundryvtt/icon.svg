<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="75%">
      <stop offset="0" stop-color="#3a1d12"/>
      <stop offset="0.55" stop-color="#1a1220"/>
      <stop offset="1" stop-color="#0a0910"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2641a"/>
      <stop offset="1" stop-color="#9c3410"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2c0e"/>
      <stop offset="1" stop-color="#4a1608"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="url(#bg)"/>
  <circle cx="128" cy="134" r="112" fill="url(#glow)"/>

  <!-- embers -->
  <g fill="#ffb347">
    <circle cx="44" cy="58" r="2.2" opacity="0.8"/>
    <circle cx="214" cy="46" r="1.8" opacity="0.7"/>
    <circle cx="226" cy="120" r="1.4" opacity="0.6"/>
    <circle cx="30" cy="150" r="1.6" opacity="0.6"/>
    <circle cx="70" cy="28" r="1.3" opacity="0.5"/>
    <circle cx="190" cy="222" r="1.6" opacity="0.5"/>
    <circle cx="58" cy="226" r="1.2" opacity="0.4"/>
  </g>

  <!-- d20 -->
  <g stroke="#ffe3b0" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="128,48 128,86 55,90" fill="url(#side)"/>
    <polygon points="128,48 201,90 128,86" fill="url(#side)"/>
    <polygon points="55,90 128,86 78,162" fill="url(#side)"/>
    <polygon points="201,90 178,162 128,86" fill="url(#side)"/>
    <polygon points="55,90 78,162 55,174" fill="url(#dark)"/>
    <polygon points="201,90 201,174 178,162" fill="url(#dark)"/>
    <polygon points="55,174 78,162 128,216" fill="url(#dark)"/>
    <polygon points="201,174 128,216 178,162" fill="url(#dark)"/>
    <polygon points="78,162 178,162 128,216" fill="url(#side)"/>
    <polygon points="128,86 178,162 78,162" fill="url(#front)"/>
  </g>
  <text x="128" y="148" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
